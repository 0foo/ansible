- name: Configure local user environment
  # runs on every host in the inventory, any OS - user-level dotfiles only, no system config
  hosts: all
  become: false

  tasks:
  - name: Ensure common directories exist
    file:
      path: "{{ item }}"
      state: directory
    loop:
    - "{{ ansible_facts['env']['HOME'] }}/bin"
    - "{{ ansible_facts['env']['HOME'] }}/projects"
    - "{{ ansible_facts['env']['HOME'] }}/.config"

  - name: Install user dotfiles
    copy:
      src: ../files/bashrc
      dest: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      mode: "0644"

  - name: Add bash functions and aliases
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bash_aliases"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: bash functions"
      block: |
        # sort by size (largest first), include dotfiles, human readable
        alias ll='ls -lahS'

        git_go() {
          git add . && git commit -m "save state" && git push -u origin HEAD
        }

        git_clear_cache() {
          git rm -r --cached . && git add . && git commit -m "Clear Git cache and update untracked files"
        }

        git_ssh_key_generate() {
          ssh-keygen -t ed25519
        }

        ssh_add_keyfile() {
          eval "$(ssh-agent -s)"
          ssh-add "$1"
        }

        wipe_history_full() {
          : > ~/.bash_history
          history -c
        }
        http () {
          python3 -m http.server "${1:-8000}"
        }

  - name: Ensure local bin directory exists
    file:
      path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
      state: directory
      mode: "0755"

  - name: Copy hyperjump script into ~/.local/bin
    copy:
      src: ../files/hyperjump/hyperjump.sh
      dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/hyperjump.sh"
      mode: "0755"

  - name: Source hyperjump on every interactive bash session
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: hyperjump"
      block: |
        # Load hyperjump (interactive shells only)
        case $- in
          *i*) source "$HOME/.local/bin/hyperjump.sh" ;;
        esac

  - name: Ensure ~/.config/bash exists
    file:
      path: "{{ ansible_facts['env']['HOME'] }}/.config/bash"
      state: directory
      mode: "0755"

  - name: Install GUI bash module
    copy:
      src: ../files/bash/gui-module.sh
      dest: "{{ ansible_facts['env']['HOME'] }}/.config/bash/gui-module.sh"
      mode: "0644"

  - name: Source GUI module in interactive bash sessions
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: gui-module"
      block: |
        # Load GUI module (interactive shells only)
        case $- in
          *i*) [ -f "$HOME/.config/bash/gui-module.sh" ] && source "$HOME/.config/bash/gui-module.sh" ;;
        esac

  - name: Configure bash history behavior (time + shared + sizes)
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: bash-history"
      block: |
        # display history with time
        export HISTTIMEFORMAT="%m/%d/%Y[%T] "

        ## SHARE HISTORY BETWEEN TERMINALS
        # Avoid duplicates
        export HISTCONTROL=ignoredups:erasedups
        # When the shell exits, append to the history file instead of overwriting it
        shopt -s histappend

        # for setting history length see HISTSIZE and HISTFILESIZE in bash(1)
        export HISTSIZE=-1
        export HISTFILESIZE=-1

        history() {
          if [ $# -eq 0 ]; then
            # No arguments, apply custom formatting
            command history | awk '{$1=""; print substr($0,2)}'
          else
            # Arguments present, run the built-in history command with the arguments
            command history "$@"
          fi
        }
  - name: Ensure ~/.ssh exists
    file:
      path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
      state: directory
      mode: "0700"

  - name: Install ssh-agent autoload bash module
    copy:
      src: ../files/bash/ssh-agent-init.sh
      dest: "{{ ansible_facts['env']['HOME'] }}/.config/bash/ssh-agent-init.sh"
      mode: "0644"

  - name: Source ssh-agent autoload module in interactive bash sessions
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: ssh-agent-init"
      block: |
        # Start/reuse ssh-agent and load all ~/.ssh keys (interactive shells only)
        case $- in
          *i*) [ -f "$HOME/.config/bash/ssh-agent-init.sh" ] && source "$HOME/.config/bash/ssh-agent-init.sh" ;;
        esac

  - name: Ensure ~/.bashrc sources ~/.bash_aliases
    blockinfile:
      path: "{{ ansible_facts['env']['HOME'] }}/.bashrc"
      create: true
      marker: "# {mark} ANSIBLE MANAGED BLOCK: source-bash-aliases"
      block: |
        # Load user aliases last so they override /etc/bashrc
        if [ -f "$HOME/.bash_aliases" ]; then
          source "$HOME/.bash_aliases"
        fi



